<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Checkout | Boardwalk Woodworks
</title>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta property="og:title"
content="Boardwalk Woodworks Checkout">

<meta property="og:image"
content="https://chainsawclay.com/woodworks/img/hero.jpg">

<link rel="stylesheet"
href="/woodworks/css/woodworks.css">

</head>

<body>

<header class="wood-header">

<h1>
Boardwalk Woodworks
</h1>

<p>
Secure Checkout
</p>

</header>

<div class="wood-container">

<div class="checkout-summary">

<h2>Your Piece</h2>

<div id="checkoutPiece">

Loading Piece...

</div>

</div>

<form id="checkoutForm">

<h2>Buyer Information</h2>

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="tel"
name="phone"
placeholder="Phone Number">

<h2>Shipping Information</h2>

<input
type="text"
name="address"
placeholder="Street Address"
required>

<input
type="text"
name="city"
placeholder="City"
required>

<input
type="text"
name="state"
placeholder="State"
required>

<input
type="text"
name="zip"
placeholder="Zip Code"
required>

<select
name="shippingType">

<option value="pickup">
Local Pickup
</option>

<option value="whiteglove">
White Glove Delivery
</option>

<option value="freight">
Freight Shipping
</option>

</select>

<button
type="submit"
class="wood-btn">

Complete Purchase

</button>

</form>

</div>
