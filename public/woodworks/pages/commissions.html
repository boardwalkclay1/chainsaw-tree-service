<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Custom Commission Request
</title>

<link rel="stylesheet"
href="/woodworks/css/woodworks.css">

</head>

<body>

<header class="wood-header">

<h1>
Commission A Piece
</h1>

<p>
Custom One-Of-One Creations
</p>

</header>

<div class="wood-container">

<form id="commissionForm">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="tel"
placeholder="Phone">

<select>

<option>
Dining Table
</option>

<option>
Coffee Table
</option>

<option>
Bench
</option>

<option>
Desk
</option>

<option>
Custom
</option>

</select>

<textarea
rows="8"
placeholder="Describe Your Project"></textarea>

<button
class="wood-btn">

Request Consultation

</button>

</form>

</div>

<div id="squirrelChat">

<img
src="/climbing-class/public/app/img/squirell-img.jpg"
id="squirrelChatBtn">

<div id="squirrelBubble">

<div id="squirrelMessages"></div>

<input
id="squirrelInput"
type="text"
placeholder="Ask me something…">

</div>

</div>

<script src="/climbing-class/public/js/squirrel.js"></script>

</body>
</html>
